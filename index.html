        function resizeImageDataUrl(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                let width = img.width, height = img.height;
                const scale = Math.min(1, 800 / Math.max(width, height));
                width = Math.round(width*scale); height = Math.round(height*scale);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const m = dataUrl.match(/^data:(image\/[^;]+);base64,/i);
                const mime = m ? m[1].toLowerCase() : 'image/png';
                const supported = ['image/png','image/jpeg','image/webp'];
                const target = supported.includes(mime) ? mime : 'image/png';
                function render() {
                    canvas.width = width; canvas.height = height;
                    ctx.clearRect(0,0,width,height);
                    ctx.drawImage(img,0,0,width,height);
                    return (target==='image/jpeg'||target==='image/webp') ? canvas.toDataURL(target,0.8) : canvas.toDataURL(target);
                }
                let result = render();
                while (result.length > MAX_EXCEL_TEXT_LENGTH && Math.max(width,height) > 120) {
                    width = Math.round(width*.85); height = Math.round(height*.85); result = render();
                }
                if (result.length > MAX_EXCEL_TEXT_LENGTH) { callback('','Ảnh quá lớn. Vui lòng chọn ảnh nhỏ hơn.'); return; }
                callback(result);
            };
            img.onerror = function() { callback('','Không thể đọc ảnh.'); };
            img.src = dataUrl;
        }

        function handleMarkerImageFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                resizeImageDataUrl(e.target.result, function(resizedDataUrl, errorMessage) {
                    const preview = document.getElementById('markerImagePreview');
                    if (resizedDataUrl) {
                        markerImageDataUrl = resizedDataUrl;
                        if (preview) preview.innerHTML = `<img src="${markerImageDataUrl}" alt="Ảnh trụ">`;
                        displayError('Ảnh đã sẵn sàng.');
                    } else {
                        markerImageDataUrl = '';
                        if (preview) preview.innerHTML = '';
                        displayError(errorMessage);
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        async function syncRowToGAS(row) {
            if (!KHAOSAT_GAS_URL) return;
            try {
                let imagePath = row[12] || '';
                if (imagePath && imagePath.startsWith('data:')) {
                    const ext = getImageExtensionFromDataUrl(imagePath);
                    const upRes = await fetch(KHAOSAT_GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'upload_image', imageBase64: getBase64FromDataUrl(imagePath), soTru: row[1] || '', ext })
                    });
                    const upData = await upRes.json();
                    if (upData.status === 'ok') { imagePath = upData.path; row[12] = imagePath; }
                }
                const res = await fetch(KHAOSAT_GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'full_update',
                        id: String(row[0] || ''), tenTru: row[1] || '',
                        lat: row[2], lon: row[3],
                        ghiChu: row[4] || '', nguoiKS: row[5] || '', loai: row[6],
                        tuDieuKhien: row[7] || '', loaiTru: row[8] || '',
                        loaiCan: row[9] || '', loaiDen: row[10] || '',
                        congSuat: row[11] || '', hinhAnh: imagePath,
                        capNhat: row[13] || '', markerGoc: row[14] || '',
                        khoangCach: row[15] || '', maPE: row[16] || '',
                        duong: row[17] || '', phuongXa: row[18] || ''
                    })
                });
                const data = await res.json();
                if (data.status !== 'ok') throw new Error(data.message || 'lỗi không rõ');
                displayError('Đã lưu lên Google Sheets.');
            } catch (e) {
                console.error('syncRowToGAS:', e);
                displayError('Lỗi lưu Google Sheets: ' + (e.message || e));
            }
        }

        async function saveMarkerPopup() {
            // đợi geocoding hoàn tất nếu đang chạy
            if (_pendingGeocodePromise) {
                displayError('Đang tra cứu địa chỉ...');
                try { await _pendingGeocodePromise; } catch(e) {}
            }
            try {
                if (!markerPopupLocation || !Array.isArray(markerPopupLocation) || markerPopupLocation.length !== 2) {
                    displayError('Chưa có vị trí — nhấn "Vị trí hiện tại" hoặc "Chọn trên bản đồ".');
                    return; // Giữ nguyên form, không đóng
                }
                const lat = Number(markerPopupLocation[0]), lon = Number(markerPopupLocation[1]);
                if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                    displayError('Tọa độ không hợp lệ — nhấn "Vị trí hiện tại" để thử lại.');
                    return; // Giữ nguyên form, không đóng
                }
                const nameInput = document.getElementById('markerNameInput');
                const noteInput = document.getElementById('markerNoteInput');
                const baseSelect = document.getElementById('markerBaseSelect');
                const name = nameInput.value.trim();
                if (!name) { displayError('Vui lòng nhập tên trụ.'); nameInput.focus(); return; }
                const note = noteInput.value.trim();
                const cabinetName = document.getElementById('markerCabinetInput').value.trim();
                const poleTypeSel = document.getElementById('markerPoleTypeSelect');
                const poleTypeManual = document.getElementById('markerPoleTypeInput');
                const selVal = poleTypeSel ? Number(poleTypeSel.value) : 0;
                const poleType = (selVal === 0)
                    ? (poleTypeManual ? poleTypeManual.value.trim() : '')
                    : (TYPE_CONFIG[selVal] ? TYPE_CONFIG[selVal].label : '');
                const lampType = getLampTypeValue();
                const congSuat = (document.getElementById('markerCongSuatInput') || {}).value?.trim() || '';
                const maPE = (document.getElementById('markerMaPEInput') || {}).value?.trim() || '';
                const streetEl = document.getElementById('markerStreetInput');
                const street = streetEl ? streetEl.value.trim() : '';
                const wardEl = document.getElementById('markerWardInput');
                const ward = wardEl ? wardEl.value.trim() : '';
                lastMarkerName = name; lastMarkerNote = note; lastMarkerCabinet = cabinetName;
                lastMarkerPoleType = poleType; lastMarkerLampType = lampType;
                lastMarkerStreet = street; lastMarkerWard = ward;
                const type = currentMarkerType || 1;
                let baseMarkerName = '', distanceToBase = '';
                if (baseSelect && baseSelect.value !== '') {
                    const bm = markers[parseInt(baseSelect.value, 10)];
                    if (bm) { baseMarkerName = bm.name||''; distanceToBase = Math.round(getDistanceMeters(bm.lat,bm.lon,lat,lon)); }
                }
                if (!Array.isArray(loadedData)) loadedData = [];
                if (!Array.isArray(newMarkerRows)) newMarkerRows = [];
                const updatedAt = new Date().toLocaleString('vi-VN');
                const nguoiKS = currentUser ? (currentUser.displayName || currentUser.username) : '';
                const newRow = ['',name,lat,lon,note,nguoiKS,type,cabinetName,poleType,'',lampType,congSuat,markerImageDataUrl||'',updatedAt,baseMarkerName,distanceToBase,maPE,street,ward];
                loadedData.push(newRow); newMarkerRows.push(newRow);
                markerImageDataUrl = null;
                const newMarker = addMarkerRowToMap(newRow);
                if (newMarker) { map.setView([newMarker.getLatLng().lat, newMarker.getLatLng().lng], 19); newMarker.openPopup(); }

        function createDxfForMarkers(rows) {
            const lines = [];
            const L2 = t => lines.push(t);
            L2('0');L2('SECTION');L2('2');L2('HEADER');L2('0');L2('ENDSEC');
            L2('0');L2('SECTION');L2('2');L2('ENTITIES');
            let previousPoint = null;
            rows.forEach((row, index) => {
                const name = row[1]||row[0]||`Marker ${index+1}`;
                const rawX = parseCoord(row[3]), rawY = parseCoord(row[2]);
                if (!Number.isFinite(rawX)||!Number.isFinite(rawY)) return;
                const label = name.replace(/\r?\n/g,' ');
                const vn = convertLatLonToVn2000(rawY, rawX);
                const x = vn.x, y = vn.y;
                L2('0');L2('CIRCLE');L2('8');L2('0');L2('10');L2(x.toFixed(6));L2('20');L2(y.toFixed(6));L2('30');L2('0');L2('40');L2('1.0');
                if (previousPoint) {
                    L2('0');L2('LINE');L2('8');L2('0');
                    L2('10');L2(previousPoint.x.toFixed(6));L2('20');L2(previousPoint.y.toFixed(6));L2('30');L2('0');
                    L2('11');L2(x.toFixed(6));L2('21');L2(y.toFixed(6));L2('31');L2('0');
                    const dist = Math.sqrt((x-previousPoint.x)**2+(y-previousPoint.y)**2);
                    L2('0');L2('TEXT');L2('8');L2('0');
                    L2('10');L2(((x+previousPoint.x)/2).toFixed(6));L2('20');L2(((y+previousPoint.y)/2).toFixed(6));L2('30');L2('0');L2('40');L2('1.0');L2('1');L2(`${Math.round(dist)}m`);
                }
                L2('0');L2('TEXT');L2('8');L2('0');L2('10');L2(x.toFixed(6));L2('20');L2((y+0.0015).toFixed(6));L2('30');L2('0');L2('40');L2('1.0');L2('1');L2(label);
                previousPoint = { x, y };
            });
            L2('0');L2('ENDSEC');L2('0');L2('EOF');
            return lines.join('\r\n');
        }

        function getImageExtensionFromDataUrl(dataUrl) {
            const m = dataUrl.match(/^data:image\/(png|jpeg|jpg|webp);base64,/i);
            if (!m) return 'png';
            return m[1].toLowerCase()==='jpg' ? 'jpeg' : m[1].toLowerCase();

        function sanitizeFileName(name) {
            return (name||'marker').toString().trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-_.]/g,'').replace(/\-+/g,'-').replace(/^[-_.]+|[-_.]+$/g,'')||'marker';

        function getImagePathForMarker(name, dataUrl) {

        async function uploadGitHubImageFile(owner, repo, path, branch, token, dataUrl, message) {
            if (!dataUrl||typeof dataUrl!=='string'||!dataUrl.startsWith('data:image/')) return null;
            const existing = await getGitHubFileContent(owner, repo, path, branch, token);
            const body = { message: message||`Upload image ${path}`, content: getBase64FromDataUrl(dataUrl), branch };

                method:'PUT', headers:{ Authorization:`token ${token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: JSON.stringify(body)
            });

        async function prepareImagePathsForGitHub(rows, owner, repo, branch, token) {
            if (!Array.isArray(rows)) return [];
            const uploaded = [];
            for (const row of rows) {
                if (!Array.isArray(row)) continue;
                const img = row[12];
                if (typeof img==='string' && img.startsWith('data:image/')) {
                    const path = getImagePathForMarker(row[1]||row[0]||'marker', img);
                    await uploadGitHubImageFile(owner,repo,path,branch,token,img,`Upload marker image ${path}`);
                    row[12] = path; uploaded.push(path);
                }
            }
            return uploaded;

        function prepareImagePathsForSave(rows) {
            if (!Array.isArray(rows)) return [];
            const downloaded = [];
            rows.forEach(row => {
                if (!Array.isArray(row)) return;
                const img = row[12];
                if (typeof img==='string' && img.startsWith('data:image/')) {
                    const path = getImagePathForMarker(row[1]||row[0]||'marker', img);
                    row[12] = path; downloaded.push({ dataUrl: img, path });
                }
            });
            downloaded.forEach(item => downloadDataUrlFile(item.dataUrl, item.path));
            return downloaded;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunk = 0x8000;
            for (let i=0; i<bytes.length; i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
            return btoa(binary);
        }

        async function createExcelBufferWithImages(rows) {
            const ExcelJSGlobal = typeof ExcelJS!=='undefined' ? ExcelJS : (typeof window!=='undefined' ? window.ExcelJS : undefined);
            if (!ExcelJSGlobal) return null;
            const workbook = new ExcelJSGlobal.Workbook();
            const ws = workbook.addWorksheet('Sheet1');
            const header = ['ID','Tên trụ','Lat','Lon','Ghi chú','Người KS','Loại','Tủ điều khiển','Loại trụ','Loại cần','Loại đèn','Công suất','Ảnh','Thời gian cập nhật','Tên marker gốc','Khoảng cách (m)','Mã PE'];
            ws.addRow(header);
            [8,20,12,12,24,14,10,18,14,12,14,12,24,20,20,16,12].forEach((w,i)=>{ ws.getColumn(i+1).width = w; });
            for (let i=0; i<rows.length; i++) {
                const row = Array.isArray(rows[i]) ? [...rows[i]] : [];
                const imgData = row[12]||'';
                const rowData = [...row];
                if (typeof imgData==='string' && imgData.startsWith('data:image/')) rowData[12]='';
                const excelRow = ws.addRow(rowData);
                if (typeof imgData==='string' && imgData.startsWith('data:image/')) {
                    const ext = getImageExtensionFromDataUrl(imgData);
                    const imageId = workbook.addImage({ base64: imgData.replace(/^data:image\/[^;]+;base64,/,''), extension: ext });
                    ws.addImage(imageId, { tl:{col:12,row:excelRow.number-1}, ext:{width:180,height:120}, editAs:'oneCell' });
                    ws.getRow(excelRow.number).height = 95;
                }
            }
            return await workbook.xlsx.writeBuffer();
        }

        function attachImagesToWorksheet(worksheet, rows, startRow=1) {
            if (!worksheet || !Array.isArray(rows)) return;
            const images = [];
            rows.forEach((row, index) => {
                const imgData = row[12];
                const rowIndex = startRow + index;
                const cellAddress = XLSX.utils.encode_cell({ r:rowIndex, c:12 });
                if (typeof imgData==='string' && imgData.startsWith('data:image/')) {
                    worksheet[cellAddress] = { t:'s', v:'' };
                    images.push({ image:imgData, origin:{r:rowIndex,c:12}, base64:true });
                    worksheet['!cols'] = worksheet['!cols']||[];
                    worksheet['!cols'][12] = { wpx:140 };
                    worksheet['!rows'] = worksheet['!rows']||[];
                    worksheet['!rows'][rowIndex] = { hpx:120 };
                } else if (typeof imgData==='string' && imgData) {
                    worksheet[cellAddress] = { t:'s', v:imgData };
                }
            });
            if (images.length > 0) worksheet['!images'] = images;
        }

        function parseCSVText(text) {
            const rows = [];
            for (const line of text.split(/\r?\n/)) {
                if (!line.trim()) continue;
                const row = [];
                let inQuote = false, cell = '';
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (ch === '"') { inQuote = !inQuote; }
                    else if (ch === ',' && !inQuote) { row.push(cell); cell = ''; }
                    else { cell += ch; }
                }
                row.push(cell);
                rows.push(row);
            }
            return rows;
        }

        function searchMarkers() {
            const rawInput = document.getElementById('searchInput').value.trim();
            clearSearchResults();
            if (!rawInput) { displayError('Vui lòng nhập tên trụ hoặc tọa độ.'); return; }
            const input = normalizeText(rawInput);
            const matches = [];
            for (let i=0; i<markers.length; i++) {
                const item = markers[i];
                if (normalizeText(item.name||'').includes(input) || normalizeText(item.note||'').includes(input) || normalizeText(item.id||'').includes(input))
                    matches.push({ index:i, item });
            }
            if (matches.length===1) {
                map.setView([matches[0].item.lat, matches[0].item.lon], 18);
                matches[0].item.marker.openPopup();
                displayError(`Tìm thấy: ${matches[0].item.name||'Không có tên'}`);
                return;
            }
            if (matches.length>1) {
                map.setView([matches[0].item.lat, matches[0].item.lon], 18);
                matches[0].item.marker.openPopup();
                const results = document.getElementById('searchResults');
                const list = document.createElement('ul');
                matches.forEach(match=>{
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href='#';
                    const idPart = match.item.id ? ` [${match.item.id}]` : '';
                    a.textContent = `${match.item.name||'Không có tên'}${idPart} (${match.item.lat.toFixed(5)}, ${match.item.lon.toFixed(5)})`;
                    a.onclick = e=>{ e.preventDefault(); goToMarker(match.index); clearSearchResults(); };
                    li.appendChild(a); list.appendChild(li);
                });
                results.appendChild(list);
                displayError(`Tìm thấy ${matches.length} kết quả.`);
                return;
            }
            if (rawInput.includes(',')) {
                const coords = rawInput.split(',').map(c=>parseFloat(c.trim()));
                if (coords.length===2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    map.setView([coords[0], coords[1]], 18);
                    displayError(`Đã nhảy tới: ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`);
                    return;
                }
            }
            displayError('Không tìm thấy điểm phù hợp.');
        }

            if (type === 'success') div.classList.add('toast-success');

            _toastTimer = setTimeout(() => { div.style.display = 'none'; }, 4000);

        function startTrackingCurrentLocation() {
            if (!navigator.geolocation) { displayError('Trình duyệt không hỗ trợ định vị.'); return; }
            if (currentLocationWatchId !== null) return;
            currentLocationWatchId = navigator.geolocation.watchPosition(
                pos => updateCurrentLocationMarker(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                err => displayError('Không thể lấy vị trí: ' + err.message),
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
            );
            displayError('Đang theo dõi vị trí...');
        }

        function stopTrackingCurrentLocation() {
            if (currentLocationWatchId !== null) {
                navigator.geolocation.clearWatch(currentLocationWatchId);
                currentLocationWatchId = null;
                displayError('Đã dừng theo dõi vị trí.');
            }
        }

        function updateCurrentLocationMarker(lat, lon, accuracy) {
            currentLocation = [lat, lon];

            // Vòng tròn độ chính xác
            if (typeof accuracy === 'number' && accuracy > 0) {
                if (currentLocationAccuracyCircle) {
                    currentLocationAccuracyCircle.setLatLng([lat, lon]).setRadius(accuracy);
                } else {
                    currentLocationAccuracyCircle = L.circle([lat, lon], {
                        radius: accuracy,
                        color: '#4285f4', fillColor: '#4285f4',
                        fillOpacity: 0.08, weight: 1.5, opacity: 0.35
                    }).addTo(map);
                    currentLocationAccuracyCircle.bringToBack();
                }
            }

            // Icon vị trí
            if (currentLocationMarker) {
                currentLocationMarker.setLatLng([lat, lon]);
            } else {
                currentLocationMarker = L.marker([lat, lon], {
                    icon: customIcons.currentPos,
                    zIndexOffset: 1000,
                    interactive: false
                }).addTo(map);
            }

            if (currentLocationWatchId !== null) {
                map.setView([lat, lon], Math.max(map.getZoom(), 17), { animate: true });
            }
        }

        function createMapControls() {
            const CustomControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function(map) {
                    const container = L.DomUtil.create('div', 'leaflet-control-custom');
                    L.DomEvent.disableClickPropagation(container);
                    L.DomEvent.disableScrollPropagation(container);

                    const trackingBtn = L.DomUtil.create('button','',container);
                    trackingBtn.type='button'; trackingBtn.title='Bật/tắt tracking';
                    trackingBtn.innerHTML='<i class="fa fa-street-view"></i>';
                    trackingBtn.style.color='#10b981';
                    let trackingActive = false;
                    trackingBtn.onclick = function() {
                        if (!trackingActive) { startTrackingCurrentLocation(); trackingBtn.style.color='#ef4444'; trackingActive=true; }
                        else { stopTrackingCurrentLocation(); trackingBtn.style.color='#10b981'; trackingActive=false; }
                    };

                    const locateBtn = L.DomUtil.create('button','',container);
                    locateBtn.type='button'; locateBtn.title='Về vị trí hiện tại';
                    locateBtn.innerHTML='<i class="fa fa-location-arrow"></i>';
                    L.DomEvent.on(locateBtn,'click',L.DomEvent.stopPropagation)
                              .on(locateBtn,'click',L.DomEvent.preventDefault)
                              .on(locateBtn,'click',()=>centerOnUserLocation());

                    const routeBtn = L.DomUtil.create('button','',container);
                    routeBtn.type='button'; routeBtn.title='Dẫn đường tới trung tâm';
                    routeBtn.innerHTML='<i class="fa fa-compass"></i>';
                    L.DomEvent.on(routeBtn,'click',L.DomEvent.stopPropagation)
                              .on(routeBtn,'click',L.DomEvent.preventDefault)
                              .on(routeBtn,'click',()=>routeToMapCenter());

                    const clearBtn = L.DomUtil.create('button','',container);
                    clearBtn.type='button'; clearBtn.title='Xóa lộ trình';
                    clearBtn.innerHTML='<i class="fa fa-times"></i>';
                    L.DomEvent.on(clearBtn,'click',L.DomEvent.stopPropagation)
                              .on(clearBtn,'click',L.DomEvent.preventDefault)
                              .on(clearBtn,'click',()=>clearRoute());

                    return container;
                }
            });
            map.addControl(new CustomControl());
        }

        function routeToMapCenter() {
            const dest = [map.getCenter().lat, map.getCenter().lng];
            if (!Number.isFinite(dest[0])||!Number.isFinite(dest[1])) { displayError('Không thể lấy điểm đến.'); return; }
            function doRoute() {
                fetchMotorbikeRoute(currentLocation, dest).then(route=>drawRoute(route)).catch(e=>displayError(e.message));
            }
            if (currentLocation) { doRoute(); return; }
            if (!navigator.geolocation) { displayError('Trình duyệt không hỗ trợ định vị.'); return; }
            navigator.geolocation.getCurrentPosition(
                pos=>{ updateCurrentLocationMarker(pos.coords.latitude, pos.coords.longitude); doRoute(); },
                err=>displayError('Không thể lấy vị trí: '+err.message),
                { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
            );
        }

        function routeToMarkerLatLon(lat, lon) {
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) { displayError('Tọa độ không hợp lệ.'); return; }
            map.closePopup();
            const dest = [lat, lon];
            function doRoute() {
                fetchMotorbikeRoute(currentLocation, dest).then(route => drawRoute(route)).catch(e => displayError(e.message));
            }
            if (currentLocation) { doRoute(); return; }
            if (!navigator.geolocation) {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`, '_blank');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => { updateCurrentLocationMarker(pos.coords.latitude, pos.coords.longitude); doRoute(); },
                () => { window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`, '_blank'); },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function confirmDeleteMarker(btn) {
            if (!btn.classList.contains('confirm')) {
                btn.classList.add('confirm');
                btn.textContent = '⚠️ Xác nhận?';
                setTimeout(() => {
                    if (btn.classList.contains('confirm')) {
                        btn.classList.remove('confirm');
                        btn.textContent = '🗑 Xóa';

                }, 3000);

                deleteMarker();
            }

        async function deleteMarker() {
            if (!_currentPopupRow) return;
            const row = _currentPopupRow;
            const name = row[1] || row[0] || '';
            const lat = parseCoord(row[2]), lon = parseCoord(row[3]);
            const id = String(row[0] || '');

            map.closePopup();

            // Xóa khỏi map
            const md = markers.find(m =>
                normalizeText(m.name||'') === normalizeText(name) &&
                Math.abs((m.lat||0) - lat) < 0.000001 &&
                Math.abs((m.lon||0) - lon) < 0.000001
            );
            if (md) {
                markersCluster.removeLayer(md.marker);
                labelLayerGroup.getLayers().slice().forEach(layer => {
                    const html = layer.getIcon && layer.getIcon().options.html;
                    if (html && html.includes(name)) labelLayerGroup.removeLayer(layer);
                });
                markers.splice(markers.indexOf(md), 1);
            }

            // Xóa khỏi dữ liệu cục bộ
            [loadedData, newMarkerRows].forEach(arr => {
                if (!Array.isArray(arr)) return;
                const idx = arr.indexOf(row);
                if (idx !== -1) arr.splice(idx, 1);
            });

            _currentPopupRow = null;
            displayError(`Đã xóa marker "${name}" trên bản đồ — đang đồng bộ...`);

            // Đồng bộ lên GAS / Google Sheet
            try {
                const resp = await fetch(KHAOSAT_GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete_row', id, tenTru: name })
                });
                const json = await resp.json();
                if (json.status === 'ok') {
                    displayError(`Đã xóa "${name}" khỏi Google Sheet.`, 'success');
                } else {
                    displayError(`Xóa trên bản đồ OK, nhưng Sheet báo lỗi: ${json.message || ''}`, 'warning');
                }
            } catch (e) {
                displayError(`Xóa trên bản đồ OK, không thể kết nối Sheet: ${e.message}`, 'warning');
            }
        }

        function clearRoute() {
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        }

        function fetchMotorbikeRoute(origin, destination) {
            return fetch(`https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`)
                .then(r=>{ if(!r.ok) throw new Error('Không thể tải lộ trình.'); return r.json(); })
                .then(data=>{ if(!data.routes||data.routes.length===0||data.code!=='Ok') throw new Error('Không tìm thấy lộ trình.'); return data.routes[0]; });
        }

        function drawRoute(route) {
            clearRoute();
            routeLine = L.geoJSON(route.geometry, { style:{ color:'#ef4444', weight:5, opacity:.8 } }).addTo(map);
            if (routeLine && routeLine.getBounds) map.fitBounds(routeLine.getBounds().pad(.15));
            if (route.distance!=null && route.duration!=null)
                displayError(`Lộ trình: ${(route.distance/1000).toFixed(1)} km, ~${Math.round(route.duration/60)} phút.`);
        }

        function centerOnUserLocation() {
            if (!navigator.geolocation) { displayError('Trình duyệt không hỗ trợ định vị.'); return; }

            const btn = document.querySelector('#bottomActionBar .bab-btn');
            if (btn) { btn.style.opacity = '.5'; btn.style.pointerEvents = 'none'; }
            const done = () => { if (btn) { btn.style.opacity = ''; btn.style.pointerEvents = ''; } };

            // Lần 1: vị trí cache (nhanh) → center ngay
            navigator.geolocation.getCurrentPosition(
                pos => {
                    done();
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    updateCurrentLocationMarker(lat, lon, pos.coords.accuracy);
                    map.setView([lat, lon], Math.max(map.getZoom(), 17), { animate: true });
                },
                err => { done(); displayError('Không thể lấy vị trí: ' + err.message); },
                { enableHighAccuracy: false, timeout: 5000, maximumAge: 30000 }
            );

            // Lần 2: GPS chính xác → cập nhật icon & vòng tròn (không zoom lại)
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    updateCurrentLocationMarker(lat, lon, pos.coords.accuracy);
                },
                () => {},
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        async function reverseGeocode(lat, lon) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=vi&addressdetails=1`;
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) return null;
                const data = await res.json();
                return data.address || null;
            } catch (e) { return null; }
        }

        async function fillGeoFields(lat, lon) {
            const streetEl = document.getElementById('markerStreetInput');
            const wardEl = document.getElementById('markerWardInput');
            if (streetEl) { streetEl.value = ''; streetEl.placeholder = 'Đang tra cứu...'; }
            if (wardEl)   { wardEl.value   = ''; wardEl.placeholder   = 'Đang tra cứu...'; }

            const promise = reverseGeocode(lat, lon);
            _pendingGeocodePromise = promise;

            const addr = await promise;
            if (_pendingGeocodePromise !== promise) return; // bị ghi đè bởi lần gọi mới hơn
            _pendingGeocodePromise = null;

            const road = addr ? (addr.road || addr.pedestrian || addr.footway || addr.path || addr.cycleway || '') : '';
            const ward = addr ? (addr.suburb || addr.quarter || addr.neighbourhood || addr.village || addr.hamlet || addr.town || '') : '';

            if (streetEl) { streetEl.value = road; streetEl.placeholder = 'Tên đường...'; }
            if (wardEl)   { wardEl.value   = ward; wardEl.placeholder   = 'Nhập tên phường hoặc xã'; }
        }

        function setMarkerToCurrentLocation() {
            if (!navigator.geolocation) { displayError('Trình duyệt không hỗ trợ định vị.'); return; }
            const btn = document.getElementById('markerCurrentLocationBtn');
            const setLoading = () => {
                if (!btn) return;
                btn.disabled = true;
                btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Đang xác định...';
                btn.classList.add('btn-secondary');
                btn.classList.remove('btn-info');
            };
            const clearLoading = () => {
                if (!btn) return;
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-location-arrow"></i> Vị trí hiện tại';
                btn.classList.add('btn-info');
                btn.classList.remove('btn-secondary');
            };
            setLoading();
            navigator.geolocation.getCurrentPosition(
                pos => {
                    clearLoading();
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    const overlay = document.getElementById('markerPopupForm');
                    const formOpen = overlay && overlay.style.display === 'flex';
                    if (!formOpen) { showMarkerPopupAt(lat, lon); return; }
                    markerPopupLocation = [lat, lon]; pendingMarkerLocation = [lat, lon];
                    if (tempMarker) tempMarker.setLatLng([lat, lon]);
                    else tempMarker = L.marker([lat, lon], { icon: customIcons.currentPos }).addTo(map);
                    document.getElementById('markerCoordsText').textContent = `Tọa độ: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    map.setView([lat, lon], Math.max(map.getZoom(), 17));
                    displayError('Đã cập nhật vị trí.');
                    fillGeoFields(lat, lon);
                },
                err => {
                    clearLoading();
                    displayError('Không thể lấy vị trí: ' + err.message);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // ─── BÁO CÁO ───────────────────────────────────────────────────

        function showReportModal() {
            // Set default date range: 30 ngày gần nhất
            const today = new Date();
            const monthAgo = new Date(today); monthAgo.setDate(today.getDate() - 30);
            const fmt = d => d.toISOString().slice(0,10);
            const fromEl = document.getElementById('rptDateFrom');
            const toEl = document.getElementById('rptDateTo');

            if (toEl && !toEl.value) toEl.value = fmt(today);

            populateReportWardFilter();

                $('#reportModal').modal('show');

                    modal.style.display = 'block'; modal.offsetHeight;
                    modal.classList.add('show');
                    document.body.classList.add('modal-open');

                    bd.className = 'modal-backdrop show';
                    document.body.appendChild(bd);

        function closeReportModal() {

        // Lấy danh sách phường/xã duy nhất từ dữ liệu đã load
        function getUniqueWards() {
            const wards = new Set();
            (Array.isArray(loadedData) ? loadedData : []).forEach(row => {
                const w = (row[18] || '').toString().trim();
                if (w) wards.add(w);
            });
            return [...wards].sort((a, b) => a.localeCompare(b, 'vi', { sensitivity: 'base' }));
        }

        function populateReportWardFilter() {
            const sel = document.getElementById('rptWard');
            if (!sel) return;
            const current = sel.value;
            sel.innerHTML = '<option value="">Tất cả</option>';
            getUniqueWards().forEach(w => {
                const opt = document.createElement('option');
                opt.value = w; opt.textContent = w;
                if (w === current) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        // Parse ngày từ chuỗi vi-VN hoặc ISO
        function parseRowDate(str) {
            if (!str) return null;
            // vi-VN format: "10/5/2025, 20:30:00"
            const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
            // ISO: "2025-05-10T..."
            const d = new Date(str);
            return isNaN(d) ? null : d;
        }

        function getReportFilteredRows() {
            const fromVal = document.getElementById('rptDateFrom').value;
            const toVal = document.getElementById('rptDateTo').value;
            const ward = document.getElementById('rptWard').value;
            const type = document.getElementById('rptType').value;

            const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
            const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

            return (Array.isArray(loadedData) ? loadedData : []).filter((row, idx) => {
                if (idx === 0 && typeof row[0] === 'string' && isNaN(parseCoord(row[2]))) return false; // bỏ header
                const rowDate = parseRowDate(row[13]);
                if (fromDate && rowDate && rowDate < fromDate) return false;
                if (toDate && rowDate && rowDate > toDate) return false;
                if (ward && (row[18] || '').toString().trim() !== ward) return false;
                if (type && String(row[6]) !== type) return false;
                return true;
            });
        }

        const MARKER_TYPE_LABEL = Object.fromEntries(
            Object.entries(TYPE_CONFIG).map(([k, v]) => [k, v.label])
        );

        function renderReportPreview() {
            const rows = getReportFilteredRows();
            const el = document.getElementById('reportPreview');
            if (!el) return;

            if (!rows.length) {
                el.innerHTML = '<div class="rpt-empty"><i class="fa fa-inbox" style="font-size:28px;display:block;margin-bottom:8px"></i>Không có dữ liệu phù hợp với bộ lọc.</div>';
                return;
            }

            // Tổng hợp số lượng theo loại
            const byType = {};
            rows.forEach(r => {
                const t = String(r[6]||'1');
                byType[t] = (byType[t]||0) + 1;
            });

            const summary = `
                <div class="rpt-summary">
                    <div class="rpt-stat-card">
                        <div class="rpt-stat-num">${rows.length}</div>
                        <div class="rpt-stat-lbl">Tổng trụ</div>
                    </div>
                    <div class="rpt-stat-card">
                        <div class="rpt-stat-num">${(byType['1']||0) + (byType['2']||0)}</div>
                        <div class="rpt-stat-lbl">Trụ đèn</div>
                    </div>
                    <div class="rpt-stat-card">
                        <div class="rpt-stat-num">${byType['6']||0}</div>
                        <div class="rpt-stat-lbl">Tủ điều khiển</div>
                    </div>
                </div>`;

            const tableRows = rows.map(r => `
                <tr>
                    <td>${r[1]||'—'}</td>
                    <td>${MARKER_TYPE_LABEL[String(r[6])]||'Không xác định'}</td>
                    <td>${r[8]||'—'}</td>
                    <td>${r[10]||'—'}</td>
                    <td>${r[17]||'—'}</td>
                    <td>${r[18]||'—'}</td>
                    <td>${r[5]||'—'}</td>
                    <td>${r[13]||'—'}</td>
                </tr>`).join('');

            el.innerHTML = summary + `
                <table>
                    <thead><tr>
                        <th>Tên trụ</th>
                        <th>Loại</th>
                        <th>Loại trụ</th>
                        <th>Loại đèn</th>
                        <th>Đường</th>
                        <th>Phường/Xã</th>
                        <th>Người KS</th>
                        <th>Ngày KS</th>
                    </tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>`;
        }

        async function exportReport() {
            const rows = getReportFilteredRows();
            if (!rows.length) { displayError('Không có dữ liệu để xuất.'); return; }

            const fromVal = document.getElementById('rptDateFrom').value;
            const toVal = document.getElementById('rptDateTo').value;
            const ward = document.getElementById('rptWard').value || 'TatCa';
            const fileName = `BaoCao-${ward}-${fromVal||'all'}-${toVal||'all'}.xlsx`;

            // Tạo workbook với 2 sheet
            const ExcelJSGlobal = typeof ExcelJS !== 'undefined' ? ExcelJS : (typeof window !== 'undefined' ? window.ExcelJS : undefined);

            if (ExcelJSGlobal) {
                const wb = new ExcelJSGlobal.Workbook();
                wb.creator = 'Lighting System V1.1';
                wb.created = new Date();

                // ── Sheet 1: Tổng hợp theo phường/xã ──
                const wsSummary = wb.addWorksheet('Tổng hợp');
                wsSummary.addRow(['BÁO CÁO KHẢO SÁT HỆ THỐNG CHIẾU SÁNG']);
                wsSummary.getRow(1).font = { bold: true, size: 14 };
                wsSummary.addRow([`Từ ngày: ${fromVal||'—'}   Đến ngày: ${toVal||'—'}   Phường/Xã: ${ward==='TatCa'?'Tất cả':ward}`]);
                wsSummary.addRow([]);

                // Header tổng hợp
                const summaryHeader = wsSummary.addRow(['Loại thiết bị', 'Số lượng']);
                summaryHeader.font = { bold: true };
                summaryHeader.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF2563EB' } };
                summaryHeader.getCell(1).font = { bold:true, color:{ argb:'FFFFFFFF' } };
                summaryHeader.getCell(2).font = { bold:true, color:{ argb:'FFFFFFFF' } };

                // Tổng hợp theo loại
                const typeMap = {};
                rows.forEach(r => {
                    const t = String(r[6]||'1');
                    if (!typeMap[t]) typeMap[t] = 0;
                    typeMap[t]++;
                });
                let totalAll = 0;
                Object.entries(typeMap).sort(([a],[b])=>Number(a)-Number(b)).forEach(([t,cnt]) => {
                    totalAll += cnt;
                    const label = (TYPE_CONFIG[Number(t)] || {label: 'Không xác định'}).label;
                    wsSummary.addRow([label, cnt]);
                });
                const totalRow = wsSummary.addRow(['TỔNG', totalAll]);
                totalRow.font = { bold: true };

                [30,12].forEach((w,i) => { wsSummary.getColumn(i+1).width = w; });

                // ── Sheet 2: Chi tiết ──
                const wsDetail = wb.addWorksheet('Chi tiết');
                const detailHeader = wsDetail.addRow([
                    'STT','Tên trụ','Lat','Lon','Ghi chú','Người KS','Loại','Tủ điều khiển',
                    'Loại trụ','Loại cần','Loại đèn','Công suất','URL Ảnh','Ngày khảo sát','Marker gốc','Khoảng cách (m)','Mã PE','Đường','Phường/Xã'
                ]);
                detailHeader.font = { bold: true };
                detailHeader.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF1D4ED8' } };
                ['STT','Tên trụ','Lat','Lon','Ghi chú','Người KS','Loại','Tủ điều khiển','Loại trụ','Loại cần','Loại đèn','Công suất','URL Ảnh','Ngày khảo sát','Marker gốc','Khoảng cách','Mã PE','Đường','Phường/Xã'].forEach((h,i) => {
                    detailHeader.getCell(i+1).font = { bold:true, color:{ argb:'FFFFFFFF' } };
                });

                rows.forEach((r, i) => {
                    wsDetail.addRow([
                        i+1, r[1]||'',
                        parseCoord(r[2])||0, parseCoord(r[3])||0,
                        r[4]||'', r[5]||'', MARKER_TYPE_LABEL[String(r[6])]||'Không xác định',
                        r[7]||'', r[8]||'', r[9]||'', r[10]||'', r[11]||'',
                        r[12]&&r[12].startsWith('data:')?'(base64)':r[12]||'',
                        r[13]||'', r[14]||'', r[15]||'', r[16]||'', r[17]||'', r[18]||''
                    ]);
                });

                [5,20,12,12,20,16,14,18,12,12,12,12,30,20,18,14,14,18,16].forEach((w,i) => { wsDetail.getColumn(i+1).width = w; });

                const buffer = await wb.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display='none'; a.href=url; a.download=fileName;
                document.body.appendChild(a); a.click();
                setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
                displayError(`Đã xuất báo cáo: ${fileName} (${rows.length} trụ)`);
            } else {
                // Fallback: XLSX đơn giản
                const header = ['STT','Tên trụ','Lat','Lon','Ghi chú','Người KS','Loại','Tủ điều khiển','Loại trụ','Loại cần','Loại đèn','Công suất','URL Ảnh','Ngày khảo sát','Marker gốc','Khoảng cách (m)','Mã PE','Đường','Phường/Xã'];
                const dataRows = rows.map((r,i) => [
                    i+1, r[1]||'',
                    parseCoord(r[2])||0, parseCoord(r[3])||0,
                    r[4]||'', r[5]||'', MARKER_TYPE_LABEL[String(r[6])]||'Không xác định',
                    r[7]||'', r[8]||'', r[9]||'', r[10]||'', r[11]||'',
                    r[12]&&r[12].startsWith('data:')?'(base64)':r[12]||'',
                    r[13]||'', r[14]||'', r[15]||'', r[16]||'', r[17]||'', r[18]||''
                ]);
                const ws = XLSX.utils.aoa_to_sheet([header,...dataRows]);
                const wbx = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wbx, ws, 'Chi tiết');
                XLSX.writeFile(wbx, fileName);
                displayError(`Đã xuất báo cáo: ${fileName} (${rows.length} trụ)`);
            }
        }
    </script>
