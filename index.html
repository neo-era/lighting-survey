<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Lighting System V1.1</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Mai Vũ Lâm">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="icon" href="images/icon-192.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KS Chiếu Sáng">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* ══ DESIGN SYSTEM — CSS Variables ══ */
        :root {
            --primary:       #2563eb;
            --primary-dark:  #1d4ed8;
            --primary-light: #dbeafe;
            --secondary:     #f59e0b;
            --success:       #10b981;
            --danger:        #ef4444;
            --warning:       #f59e0b;
            --surface:       #ffffff;
            --surface-2:     #f9fafb;
            --border:        #e5e7eb;
            --text:          #111827;
            --text-muted:    #6b7280;
            --shadow:    0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.10), 0 4px 10px rgba(0,0,0,.05);
            --shadow-xl: 0 20px 40px rgba(0,0,0,.15), 0 8px 16px rgba(0,0,0,.08);
            --radius-sm: 8px;
            --radius:    12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --navy:   #0f172a; --navy2: #1e293b;
            --orange: #f97316; --red:   #ef4444;
            --topbar-h:    60px;
            --bottombar-h: 72px;
            --safe-top:    env(safe-area-inset-top,    0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* ══ RESET ══ */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; font-family: var(--font); overflow: hidden; }

        /* ══ BẢN ĐỒ FULL SCREEN ══ */
        #map { position: fixed; inset: 0; z-index: 1; }

        /* ══ TOP BAR — command bar nổi ══ */
        #topBar {
            position: fixed;
            top: calc(10px + var(--safe-top));
            left: 12px; right: 12px;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            pointer-events: none;
        }
        #topBar > * { pointer-events: auto; }

        /* Nút hamburger mở controlsModal */
        #controlsBtn {
            flex-shrink: 0;
            width: 48px; height: 48px;
            border: none;
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 19px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow);
            transition: background .15s;
            padding: 0; margin: 0;
            touch-action: manipulation;
        }
        #controlsBtn:active { background: var(--surface-2); }

        /* Thanh tìm kiếm pill */
        .topbar-search {
            flex: 1; min-width: 0;
            display: flex; align-items: center;
            background: var(--surface);
            border-radius: var(--radius-full);
            box-shadow: var(--shadow);
            padding: 0 4px 0 14px;
            height: 48px; gap: 6px;
        }
        .topbar-search i { color: var(--text-muted); font-size: 14px; flex-shrink: 0; }
        #searchInput {
            flex: 1; min-width: 0;
            border: none; outline: none;
            font-size: 16px; font-family: var(--font);
            color: var(--text); background: transparent;
        }
        #searchInput::placeholder { color: var(--text-muted); }
        .ts-btn {
            flex-shrink: 0;
            height: 38px; padding: 0 14px;
            border: none; border-radius: var(--radius-full);
            background: var(--primary); color: white;
            font-size: 13px; font-weight: 600; font-family: var(--font);
            cursor: pointer; transition: background .15s;
            touch-action: manipulation;
        }
        .ts-btn:active { background: var(--primary-dark); }

        /* Dropdown kết quả tìm kiếm */
        #searchResultsWrapper {
            position: fixed;
            top: calc(var(--safe-top) + 68px);
            left: 12px; right: 12px;
            z-index: 3001;
            pointer-events: none;
        }
        #searchResults {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            max-height: 220px;
            overflow-y: auto;
            pointer-events: auto;
        }
        #searchResults:empty { display: none; }
        #searchResults ul { list-style: none; padding: 8px; margin: 0; }
        #searchResults li { padding: 8px 10px; border-radius: var(--radius-sm); transition: background .15s; }
        #searchResults li:hover { background: var(--surface-2); }
        #searchResults a { color: var(--primary); text-decoration: none; font-size: 14px; display: block; }

        /* Badge offline */
        #offlineIndicator {
            position: fixed;
            top: calc(var(--safe-top) + 68px);
            left: 50%; transform: translateX(-50%);
            z-index: 3002;
            background: #374151; color: white;
            font-size: 12px; font-weight: 600;
            padding: 5px 14px; border-radius: var(--radius-full);
            display: none; white-space: nowrap;
        }
        body.offline #offlineIndicator { display: block; }

        /* Badge marker chưa đồng bộ */
        #pendingSyncBadge {
            position: fixed;
            top: calc(var(--safe-top) + 68px);
            right: 12px;
            z-index: 3002;
            background: var(--secondary); color: white;
            font-size: 11px; font-weight: 700;
            padding: 4px 10px; border-radius: var(--radius-full);
            display: none; white-space: nowrap;
            box-shadow: var(--shadow);
        }

        /* ══ BOTTOM ACTION BAR ══ */
        #bottomActionBar {
            position: fixed; bottom: 0; left: 0; right: 0;
            z-index: 3000;
            background: var(--surface);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 20px rgba(0,0,0,.08);
            display: flex; align-items: center; justify-content: space-around;
            padding: 8px 12px calc(8px + var(--safe-bottom));
            height: calc(var(--bottombar-h) + var(--safe-bottom));
            gap: 8px;
        }
        .bab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
            border: none; background: transparent;
            color: var(--text-muted);
            font-size: 10px; font-weight: 600; font-family: var(--font);
            cursor: pointer;
            padding: 4px 6px; border-radius: var(--radius);
            transition: color .15s, background .15s;
            touch-action: manipulation;
            min-height: 44px;
        }
        .bab-btn i { font-size: 20px; line-height: 1.2; }
        .bab-btn:active { background: var(--surface-2); color: var(--primary); }

        /* Nút Thêm marker — pill nổi bật */
        #addMarkerBtn {
            flex-shrink: 0;
            min-width: 120px; height: 44px;
            padding: 0 18px;
            border: none; border-radius: var(--radius-full);
            background: var(--primary); color: white;
            font-size: 14px; font-weight: 700; font-family: var(--font);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37,99,235,.35);
            transition: background .15s, transform .1s, box-shadow .15s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        #addMarkerBtn:active { transform: scale(.96); }
        #addMarkerBtn.btn-danger  { background: var(--danger);  box-shadow: 0 4px 14px rgba(239,68,68,.35); }
        #addMarkerBtn.btn-warning { background: var(--primary); box-shadow: 0 4px 14px rgba(37,99,235,.35); }

        /* ══ SIDE PANEL — modal slide từ trái ══ */
        .modal { z-index: 4050; }
        .modal-backdrop { z-index: 4040; }

        .modal.left .modal-dialog {
            position: fixed; left: -360px; top: 0;
            height: 100%; width: 320px; max-width: 88vw;
            margin: 0;
            transition: left .3s cubic-bezier(.4,0,.2,1);
        }
        .modal.left.show .modal-dialog { left: 0; }
        .modal.left .modal-content { height: 100%; border: none; border-radius: 0; box-shadow: var(--shadow-xl); }

        .modal.left .modal-header {
            background: var(--primary);
            border: none; padding: 0 16px;
            height: 60px; display: flex; align-items: center;
        }
        .modal.left .modal-title { color: white; font-weight: 700; font-size: 16px; }
        .modal.left .modal-header .close {
            color: white; opacity: .8;
            font-size: 24px; text-shadow: none;
            background: none; border: none; cursor: pointer;
            padding: 0; margin-left: auto; line-height: 1;
        }
        .modal.left .modal-body {
            padding: 20px 16px;
            overflow-y: auto;
            height: calc(100% - 60px);
            -webkit-overflow-scrolling: touch;
        }

        /* Nội dung side panel */
        .ctrl-section { margin-bottom: 20px; }
        .ctrl-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
        .ctrl-label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .ctrl-input {
            width: 100%; padding: 10px 12px;
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 16px; font-family: var(--font); color: var(--text); background: var(--surface);
            outline: none; transition: border-color .2s;
            -webkit-appearance: none; appearance: none;
            margin-bottom: 10px;
        }
        .ctrl-input:focus { border-color: var(--primary); }
        .ctrl-btn {
            width: 100%; padding: 11px 16px;
            border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; font-family: var(--font);
            cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: center;
            margin-bottom: 8px;
            transition: opacity .15s, transform .1s;
            touch-action: manipulation;
        }
        .ctrl-btn:active { opacity: .85; transform: scale(.98); }
        .ctrl-btn.primary { background: var(--primary); color: white; }
        .ctrl-btn.success { background: var(--success); color: white; }
        .ctrl-btn.warning { background: var(--secondary); color: white; }
        .ctrl-btn.dark    { background: #374151; color: white; }
        .ctrl-btn.outline { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--border); }
        .ctrl-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .ctrl-btn-grid .ctrl-btn { margin-bottom: 0; }
        .ctrl-divider { height: 1px; background: var(--border); margin: 16px -16px; }

        /* GitHub contents */
        #githubContents { font-size: 13px; max-height: 220px; overflow-y: auto; }
        #githubContents ul { list-style: none; padding: 0; margin: 0; }
        #githubContents li {
            padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            margin-bottom: 4px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface);
        }
        #githubContents li:hover { background: var(--surface-2); }
        #githubContents .github-path { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        #githubContents .github-item-name { font-weight: 600; color: var(--text); }
        #githubContents .github-item-type { font-size: 12px; color: var(--text-muted); }

        /* ══ MARKER FORM — BOTTOM SHEET ══ */
        #markerPopupForm {
            position: fixed; inset: 0;
            z-index: 5000;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            background: rgba(0,0,0,.38);
        }
        .marker-popup-card {
            width: 100%;
            max-height: 88vh;
            max-height: 88dvh;
            background: var(--surface);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            box-shadow: var(--shadow-xl);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .bs-handle {
            width: 40px; height: 4px;
            background: var(--border); border-radius: 2px;
            margin: 10px auto 0; flex-shrink: 0; cursor: grab;
        }
        .marker-popup-card header {
            padding: 10px 16px 12px;
            color: var(--text); font-size: 16px; font-weight: 700;
            flex-shrink: 0; border-bottom: 1px solid var(--border);
            user-select: none;
        }
        .marker-popup-card .body {
            padding: 12px 16px;
            overflow-y: auto; flex: 1;
            -webkit-overflow-scrolling: touch;
        }
        .marker-popup-card .body .form-group { margin-bottom: 10px; }
        .marker-popup-card .body label {
            display: block;
            font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px;
        }
        .marker-popup-card .body input,
        .marker-popup-card .body textarea,
        .marker-popup-card .body select {
            width: 100%; padding: 10px 12px;
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 16px; font-family: var(--font); color: var(--text); background: var(--surface);
            outline: none; transition: border-color .2s;
            -webkit-appearance: none; appearance: none;
        }
        .marker-popup-card .body input:focus,
        .marker-popup-card .body textarea:focus,
        .marker-popup-card .body select:focus { border-color: var(--primary); }
        .marker-popup-card .body textarea { resize: vertical; min-height: 64px; }

        /* Footer cố định dưới form */
        .marker-popup-card .footer {
            padding: 10px 16px calc(10px + var(--safe-bottom));
            background: var(--surface-2); border-top: 1px solid var(--border);
            flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
        }
        .footer-main-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
        .footer-location-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .marker-popup-card .footer button {
            padding: 11px 14px;
            border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; font-family: var(--font);
            cursor: pointer; display: flex; align-items: center; gap: 6px; justify-content: center;
            transition: opacity .15s, transform .1s; touch-action: manipulation; margin: 0;
            min-height: 44px;
        }
        .marker-popup-card .footer button:active { opacity: .85; transform: scale(.98); }

        /* ── Loại trụ quick-select chips ── */
        .ptc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 6px;
        }
        .ptc {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 7px; border-radius: 8px;
            border: 1.5px solid var(--border);
            background: var(--surface); color: var(--text);
            font-size: 11px; font-weight: 600; cursor: pointer;
            transition: border-color .15s, background .15s, box-shadow .15s;
            white-space: nowrap; overflow: hidden;
            touch-action: manipulation;
        }
        .ptc svg { flex-shrink: 0; }
        .ptc:active { opacity: .8; }
        .ptc.active {
            border-color: var(--ptc-color, var(--primary));
            background: var(--ptc-bg, var(--primary-light));
            box-shadow: 0 0 0 2px var(--ptc-color, var(--primary)) inset;
            color: var(--ptc-color, var(--primary));
        }

        .marker-image-preview { margin-top: 8px; display: flex; justify-content: center; }
        .marker-image-preview img {
            max-width: 100%; max-height: 140px;
            border-radius: var(--radius); border: 1px solid var(--border); object-fit: cover;
        }
        .marker-image-button { width: 100%; }
        .coords-info {
            font-size: 12px; color: var(--text-muted); margin-top: 4px;
            padding: 8px 10px; background: var(--surface-2); border-radius: var(--radius-sm);
        }

        /* ══ TOAST — id=error, JS gọi displayError ══ */
        #error {
            position: fixed;
            bottom: calc(var(--bottombar-h) + var(--safe-bottom) + 14px);
            left: 50%; transform: translateX(-50%);
            z-index: 6000;
            background: #1f2937; color: white;
            font-size: 13px; font-weight: 500; font-family: var(--font);
            padding: 10px 20px; border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            white-space: nowrap; max-width: calc(100vw - 32px);
            overflow: hidden; text-overflow: ellipsis;
            display: none;
            pointer-events: none; text-align: center;
            transition: opacity .2s;
        }
        #error.toast-success { background: var(--success); }
        #error.toast-warning { background: var(--secondary); }
        #error.toast-error   { background: var(--danger); }

        /* ══ FLOATING CONTROLS (Leaflet) ══ */
        .leaflet-control-custom {
            z-index: 2000; background: transparent; border: none; padding: 0;
            display: flex; flex-direction: column; gap: 6px;
        }
        .leaflet-control-custom button {
            width: 44px; height: 44px;
            border: none; border-radius: var(--radius);
            background: var(--surface); color: var(--text);
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow);
            transition: background .15s, transform .1s;
            touch-action: manipulation; padding: 0; margin: 0;
        }
        .leaflet-control-custom button:active { background: var(--surface-2); transform: scale(.93); }
        .leaflet-control-custom button i { pointer-events: none; }

        /* ══ MARKER LABELS ══ */
        .custom-label {
            background: none; border: none; box-shadow: none;
            font-weight: 700; color: #111;
            text-shadow: 0 0 3px white, 0 0 6px white;
        }
        .custom-crosshair-icon { background: transparent; border: none; }
        @keyframes ks-pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.7} }

        /* Google Maps–style current position dot */
        .gmap-loc-icon { background:none !important; border:none !important; overflow:visible !important; }
        .gmap-dot {
            width:18px; height:18px;
            background:#4285f4;
            border:3px solid #fff;
            border-radius:50%;
            box-shadow:0 1px 6px rgba(0,0,0,.45);
            box-sizing:border-box;
            position:relative;
        }
        .gmap-dot::before {
            content:'';
            position:absolute;
            top:50%; left:50%;
            width:42px; height:42px;
            margin:-21px 0 0 -21px;
            border-radius:50%;
            background:rgba(66,133,244,.22);
            animation:gmap-pulse 2s ease-out infinite;
            pointer-events:none;
        }
        @keyframes gmap-pulse {
            0%   { transform:scale(.25); opacity:1; }
            100% { transform:scale(1.6); opacity:0; }
        }

        /* ══ NÚT VỀ ĐẦU TRANG ══ */
        #backToTopBtn {
            display: none;
            position: fixed;
            bottom: calc(var(--bottombar-h) + var(--safe-bottom) + 16px);
            right: 16px; z-index: 3500;
            width: 44px; height: 44px;
            border: none; border-radius: var(--radius-full);
            background: var(--primary); color: white;
            font-size: 18px; cursor: pointer; box-shadow: var(--shadow);
            touch-action: manipulation;
        }

        /* ══ EXPORT CAD MODAL ══ */
        #exportCadModal .modal-content { border: none; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); }
        #exportCadModal .modal-header { background: var(--primary); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border: none; }
        #exportCadModal .modal-title { color: white; font-weight: 700; }
        #exportCadModal .modal-header .close { color: white; opacity: .8; text-shadow: none; }
        #exportCadCountInfo { font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 8px; }
        #exportCadModal .form-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
        #exportCadModal .form-control { border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font); }
        #exportCadModal .form-control:focus { border-color: var(--primary); box-shadow: none; }

        /* ══ BÁO CÁO MODAL ══ */
        #reportModal .modal-dialog { max-width: 700px; }
        #reportModal .modal-content { border: none; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); }
        #reportModal .modal-header { background: var(--primary); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border: none; padding: 0 16px; height: 56px; display: flex; align-items: center; }
        #reportModal .modal-title { color: white; font-weight: 700; font-size: 16px; }
        #reportModal .modal-header .close { color: white; opacity: .8; text-shadow: none; background: none; border: none; cursor: pointer; }
        #reportModal .modal-body { padding: 16px; }
        #reportModal .modal-footer { border-top: 1px solid var(--border); padding: 12px 16px; }

        /* Bộ lọc báo cáo */
        .rpt-filters {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .rpt-filters .form-group { margin: 0; }
        .rpt-filters label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; display: block; }
        .rpt-filters input, .rpt-filters select {
            width: 100%; padding: 9px 10px;
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 16px; font-family: var(--font); color: var(--text); background: var(--surface);
            outline: none; -webkit-appearance: none; appearance: none;
        }
        .rpt-filters input:focus, .rpt-filters select:focus { border-color: var(--primary); }
        @media (max-width: 480px) { .rpt-filters { grid-template-columns: 1fr; } }

        /* Bảng preview báo cáo */
        #reportPreview { margin-top: 8px; max-height: 320px; overflow-y: auto; font-size: 13px; }
        #reportPreview .rpt-summary {
            display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px;
        }
        .rpt-stat-card {
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 10px 12px; text-align: center;
        }
        .rpt-stat-card .rpt-stat-num { font-size: 22px; font-weight: 800; color: var(--primary); }
        .rpt-stat-card .rpt-stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        #reportPreview table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        #reportPreview th {
            position: sticky; top: 0; background: var(--surface-2);
            padding: 7px 8px; text-align: left; border-bottom: 2px solid var(--border);
            font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px;
        }
        #reportPreview td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
        #reportPreview tr:hover td { background: var(--surface-2); }
        #reportPreview .rpt-empty { text-align: center; color: var(--text-muted); padding: 24px 0; font-size: 14px; }

        /* ══ DARK MODE ══ */
        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #1f2937; --surface-2: #111827;
                --border: #374151; --text: #f9fafb; --text-muted: #9ca3af;
            }
            #error { background: #374151; }
        }

        /* ══ RESPONSIVE — Mobile nhỏ (iPhone SE, Android < 390px) ══ */
        @media (max-width: 390px) {
            #topbarUser { max-width: 100px; }
            .ptc-grid { grid-template-columns: 1fr 1fr; }
            .pc-actions.three { grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
            .pc-btn { font-size: 11px; padding: 10px 3px; gap: 3px; }
            #addMarkerBtn { min-width: 100px; font-size: 13px; padding: 0 12px; }
            .bab-btn { font-size: 9px; }
        }

        /* ══ RESPONSIVE — Desktop ══ */
        @media (min-width: 768px) {
            #markerPopupForm { justify-content: flex-end; align-items: flex-end; padding: 0 16px 16px 0; }
            .marker-popup-card { width: 420px; max-height: 85vh; max-height: 85dvh; border-radius: var(--radius-lg); }
            .bs-handle { display: none; }
            #error { bottom: auto; top: calc(var(--safe-top) + 74px); }
            #searchResultsWrapper { left: 68px; right: 12px; }
        }

        /* ══ LEAFLET POPUP CARD ══ */
        .leaflet-popup-content-wrapper { border-radius: 18px !important; box-shadow: 0 12px 40px rgba(0,0,0,.22) !important; padding: 0 !important; overflow: hidden; border: none !important; min-width: 0; }
        .leaflet-popup-content { margin: 0 !important; width: min(290px, calc(100vw - 48px)) !important; }
        .leaflet-popup-tip-container { margin-top: -1px; }
        .leaflet-popup-close-button { top: 8px !important; right: 10px !important; color: rgba(255,255,255,.8) !important; font-size: 18px !important; font-weight: 700 !important; }
        .pc { font-family: 'Inter', system-ui, sans-serif; color: #1e293b; background: #fff; border-radius: 18px; overflow: hidden; }
        .pc-topbar { height: 5px; }
        .pc-header { padding: 14px 16px 10px; display: flex; gap: 12px; align-items: flex-start; }
        .pc-avatar { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; flex-shrink: 0; border: 2px solid rgba(0,0,0,.07); cursor: zoom-in; }
        .pc-avatar-ph { width: 54px; height: 54px; border-radius: 12px; background: linear-gradient(135deg,#f1f5f9,#e2e8f0); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
        .pc-meta { min-width: 0; flex: 1; }
        .pc-name { font-size: 15px; font-weight: 800; color: #1e293b; line-height: 1.25; letter-spacing: -.2px; }
        .pc-id { font-size: 11px; color: #64748b; margin-top: 2px; }
        .pc-badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; margin-top: 7px; }
        .pc-divider { height: 1px; background: #f1f5f9; margin: 0 16px; }
        .pc-body { padding: 10px 16px 4px; }
        .pc-row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 12.5px; border-bottom: 1px solid #f8fafc; flex-wrap: wrap; }
        .pc-row:last-child { border-bottom: none; }
        .pc-row .pi { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; margin-top: 1px; }
        .pc-row .pk { color: #64748b; font-weight: 600; white-space: nowrap; min-width: 64px; flex-shrink: 0; font-size: 12px; }
        .pc-row .pv { color: #1e293b; line-height: 1.45; flex: 1; min-width: 0; }
        .pc-dist-list { flex: 0 0 100%; display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font-size: 11px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; padding: 2px; max-height: 80px; }
        .pc-coords { background: #f8fafc; border-radius: 8px; padding: 5px 10px; font-size: 10px; color: #64748b; font-family: monospace; margin-top: 8px; letter-spacing: .2px; }
        .pc-actions { display: grid; gap: 8px; padding: 12px 16px 16px; }
        .pc-actions.one   { grid-template-columns: 1fr; }
        .pc-actions.two   { grid-template-columns: 1fr 1fr; }
        .pc-actions.three { grid-template-columns: 1fr 1fr 1fr; }
        .pc-btn { padding: 11px 6px; border-radius: 11px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Inter', system-ui, sans-serif; transition: opacity .15s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 5px; touch-action: manipulation; min-height: 44px; white-space: nowrap; }
        .pc-btn:active { opacity: .82; transform: scale(.97); }
        .pc-btn.route  { background: #0ea5e9; color: #fff; }
        .pc-btn.edit   { background: #f1f5f9; color: #1e293b; }
        .pc-btn.delete { background: #fee2e2; color: #dc2626; }
        .pc-btn.delete.confirm { background: #dc2626; color: #fff; }

        /* ── Thumbnail icon on map ── */
        .img-marker-icon img { width:44px;height:44px;object-fit:cover;border-radius:8px;border:2.5px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45);display:block; }

        /* ── Full-size lightbox ── */
        #imgLightbox { display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.9);align-items:center;justify-content:center;cursor:zoom-out; }
        #imgLightbox.open { display:flex; }
        #imgLightbox img { max-width:96vw;max-height:96vh;object-fit:contain;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);pointer-events:none;display:block; }
        #imgLightboxClose { position:absolute;top:14px;right:18px;color:#fff;font-size:36px;line-height:1;cursor:pointer;opacity:.85;z-index:1; }

        /* ── LOGIN ── */
        #loginOverlay { position:fixed;inset:0;z-index:99000;background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 100%);display:none;align-items:center;justify-content:center;padding:20px; }
        #loginOverlay.visible { display:flex; }
        .login-card { background:#fff;border-radius:22px;width:min(380px,100%);box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden; }
        .login-head { background:linear-gradient(135deg,var(--navy),#1e3a5f);padding:28px 24px 22px;text-align:center;color:#fff; }
        .login-icon { font-size:42px;margin-bottom:10px; }
        .login-appname { font-size:17px;font-weight:800;letter-spacing:.02em;margin-bottom:4px;background:linear-gradient(135deg,#fbbf24,var(--orange));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; }
        .login-sub { font-size:12px;opacity:.65; }
        .login-body { padding:22px 22px 24px; }
        .login-body .lg { margin-bottom:14px; }
        .login-body .lg label { font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px; }
        .login-body .lg input { width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s;background:var(--surface-2);box-sizing:border-box; }
        .login-body .lg input:focus { border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(249,115,22,.1); }
        #loginError { min-height:20px;font-size:13px;color:var(--red);margin-bottom:10px;text-align:center; }
        .login-btn { width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--orange),#dc2626);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;box-shadow:0 4px 16px rgba(249,115,22,.4); }
        .login-btn:hover { opacity:.9; }
        .login-btn:disabled { opacity:.6;cursor:not-allowed; }
        /* user chip in topbar */
        #topbarUser { display:flex;align-items:center;gap:6px;flex-shrink:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;max-width:140px; }
        #topbarUser .av { width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#dc2626);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0; }
        #topbarUserName { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    </style>
</head>
<body>

    <!-- ═══ ĐĂNG NHẬP ═══ -->
    <div id="loginOverlay">
        <div class="login-card">
            <div class="login-head">
                <div class="login-icon">💡</div>
                <div class="login-appname">KHẢO SÁT CHIẾU SÁNG</div>
                <div class="login-sub">Hệ thống quản lý khảo sát trụ đèn đường</div>
            </div>
            <div class="login-body">
                <div class="lg">
                    <label>Tên đăng nhập</label>
                    <input id="lUsername" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username"
                        onkeydown="if(event.key==='Enter')document.getElementById('lPassword').focus()">
                </div>
                <div class="lg">
                    <label>Mật khẩu</label>
                    <input id="lPassword" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password"
                        onkeydown="if(event.key==='Enter')doLogin()">
                </div>
                <div id="loginError"></div>
                <button class="login-btn" id="loginBtn" onclick="doLogin()">Đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- ═══ BẢN ĐỒ ═══ -->
    <div id="map"></div>

    <!-- ═══ TOP BAR ═══ -->
    <div id="topBar">
        <button id="controlsBtn" title="Bảng điều khiển">
            <i class="fa fa-bars"></i>
        </button>
        <div class="topbar-search">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Tìm theo tên, ID hoặc tọa độ..." autocomplete="off">
            <button class="ts-btn" onclick="searchMarkers()">Tìm</button>
        </div>
        <div id="topbarUser" onclick="logout()" title="Đăng xuất" style="display:none">
            <div class="av">👤</div>
            <span id="topbarUserName"></span>
        </div>
    </div>

    <!-- Dropdown kết quả tìm kiếm -->
    <div id="searchResultsWrapper">
        <div id="searchResults"></div>
    </div>

    <!-- Offline / pending badges -->
    <div id="offlineIndicator">Offline</div>
    <div id="pendingSyncBadge"></div>

    <!-- ═══ BOTTOM ACTION BAR ═══ -->
    <div id="bottomActionBar">
        <button class="bab-btn" onclick="centerOnUserLocation()" title="Vị trí của tôi">
            <i class="fa fa-location-arrow"></i>
            <span>Vị trí</span>
        </button>

        <button id="addMarkerBtn" class="btn-warning" onclick="startAddMarker()" title="Thêm trụ mới">
            <i class="fa fa-plus"></i> Thêm marker
        </button>

        <button class="bab-btn" onclick="saveMarkerData()" title="Lưu dữ liệu">
            <i class="fa fa-download"></i>
            <span>Lưu</span>
        </button>
    </div>

    <!-- ═══ SIDE PANEL — Bảng điều khiển ═══ -->
    <div class="modal fade left" id="controlsModal" tabindex="-1" role="dialog" aria-labelledby="controlsModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="controlsModalLabel">Điều khiển bản đồ</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">

                    <!-- Điều hướng -->
                    <div class="ctrl-section">
                        <div class="ctrl-title">Điều hướng</div>
                        <label class="ctrl-label" for="pages">Chọn trang</label>
                        <select id="pages" class="ctrl-input" onchange="navigateToPage()">
                            <option value="index.html">Trang khảo sát</option>
                            <option value="https://neo-era.github.io/camera/">Quản lý camera</option>
                            <option value="https://neo-era.github.io/dentat/dentat.html">Quan lý đèn tắt/sự cố</option>
                            <option value="https://neo-era.github.io/lighting-survey/huongdan.html">Hướng dẫn sử dụng</option>
                        </select>
                    </div>

                    <div class="ctrl-divider"></div>

                    <!-- GitHub -->
                    <div class="ctrl-section">
                        <div class="ctrl-title">GitHub</div>
                        <label class="ctrl-label" for="githubPathInput">Đường dẫn file</label>
                        <input type="text" id="githubPathInput" class="ctrl-input" placeholder="data/khaosat.xlsx">
                        <div class="ctrl-btn-grid">
                            <button onclick="saveMarkerData()" class="ctrl-btn success">
                                <i class="fa fa-save"></i> Lưu Excel
                            </button>
                            <button onclick="updateGitHubExcel()" class="ctrl-btn primary">
                                <i class="fa fa-cloud-upload"></i> GitHub
                            </button>
                        </div>
                    </div>

                    <div class="ctrl-divider"></div>

                    <!-- Xuất dữ liệu -->
                    <div class="ctrl-section">
                        <div class="ctrl-title">Xuất dữ liệu</div>
                        <button onclick="showReportModal()" class="ctrl-btn primary" style="margin-bottom:8px">
                            <i class="fa fa-bar-chart"></i> Xuất báo cáo
                        </button>
                        <button onclick="showExportCadModal()" class="ctrl-btn dark">
                            <i class="fa fa-file-code-o"></i> Export to CAD
                        </button>
                    </div>

                    <div class="ctrl-divider"></div>

                    <!-- Nội dung GitHub -->
                    <div id="githubContents"></div>

                </div>
            </div>
        </div>
    </div>

    <!-- ═══ TOAST — displayError() ghi vào đây ═══ -->
    <div id="error" role="status" aria-live="polite"></div>

    <!-- ═══ PICK ON MAP HINT ═══ -->
    <div id="pickOnMapHint" style="display:none; position:fixed; bottom:calc(var(--bottombar-h) + var(--safe-bottom) + 14px); left:50%; transform:translateX(-50%); z-index:4500; background:#1f2937; color:white; font-size:14px; font-weight:600; padding:12px 20px 12px 16px; border-radius:999px; box-shadow:0 4px 20px rgba(0,0,0,.35); white-space:nowrap; align-items:center; gap:12px;">
        <span>📍 Nhấp vào bản đồ để chọn vị trí</span>
        <button onclick="cancelPickOnMap()" style="background:rgba(255,255,255,.15);border:none;color:white;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;">Hủy</button>
    </div>

    <!-- ═══ NÚT VỀ ĐẦU TRANG ═══ -->
    <button id="backToTopBtn" title="Về đầu trang">↑</button>

    <!-- Nút ẩn giữ tương thích JS cũ -->
    <button id="showMoreBtn" style="display:none;" onclick="toggleShowMore()"></button>

    <!-- ═══ EXPORT TO CAD MODAL ═══ -->
    <div class="modal fade" id="exportCadModal" tabindex="-1" role="dialog" aria-labelledby="exportCadModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exportCadModalLabel">Export to CAD</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close" onclick="closeExportCadModal()">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="exportCadType">Chọn loại marker để xuất</label>
                        <select id="exportCadType" class="form-control">
                            <option value="new">Chỉ marker mới nhập</option>
                            <option value="all">Tất cả marker</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="exportCadBasename">Lọc theo basename</label>
                        <input type="text" id="exportCadBasename" class="form-control" placeholder="Ví dụ: T1, T2...">
                    </div>
                    <div id="exportCadCountInfo"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeExportCadModal()">Hủy</button>
                    <button type="button" class="btn btn-primary" id="exportCadBtn">Export</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ BÁO CÁO MODAL ═══ -->
    <div class="modal fade" id="reportModal" tabindex="-1" role="dialog" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reportModalLabel"><i class="fa fa-bar-chart"></i> Xuất báo cáo khảo sát</h5>
                    <button type="button" class="close" onclick="closeReportModal()"><span>&times;</span></button>
                </div>
                <div class="modal-body">

                    <!-- Bộ lọc -->
                    <div class="rpt-filters">
                        <div class="form-group">
                            <label for="rptDateFrom">Từ ngày</label>
                            <input type="date" id="rptDateFrom" oninput="renderReportPreview()">
                        </div>
                        <div class="form-group">
                            <label for="rptDateTo">Đến ngày</label>
                            <input type="date" id="rptDateTo" oninput="renderReportPreview()">
                        </div>
                        <div class="form-group">
                            <label for="rptWard">Phường / Xã</label>
                            <select id="rptWard" onchange="renderReportPreview()">
                                <option value="">Tất cả</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="rptType">Loại marker</label>
                            <select id="rptType" onchange="renderReportPreview()">
                                <option value="">Tất cả</option>
                                <option value="1">Trụ STK</option>
                                <option value="2">Trụ trang trí</option>
                                <option value="3">Trụ HTLT</option>
                                <option value="4">Trụ TTLT</option>
                                <option value="5">Tủ chiếu sáng nổi</option>
                                <option value="6">Tủ chiếu sáng ngầm</option>
                            </select>
                        </div>
                    </div>

                    <!-- Preview -->
                    <div id="reportPreview">
                        <div class="rpt-empty">Chưa có dữ liệu. Nhấn "Làm mới" để tải.</div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeReportModal()">Đóng</button>
                    <button type="button" class="btn btn-outline-primary" onclick="renderReportPreview()">
                        <i class="fa fa-refresh"></i> Làm mới
                    </button>
                    <button type="button" class="btn btn-success" onclick="exportReport()">
                        <i class="fa fa-file-excel-o"></i> Xuất Excel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ MARKER FORM — BOTTOM SHEET ═══ -->
    <div id="markerPopupForm" role="dialog" aria-modal="true">
        <div class="marker-popup-card">
            <div class="bs-handle"></div>
            <header>Thêm / chỉnh sửa trụ đèn</header>

            <div class="footer">
                <div class="footer-main-actions">
                    <button id="markerPopupCancel" type="button" class="btn btn-secondary" onclick="cancelMarkerPopup()">
                        <i class="fa fa-times"></i> Hủy
                    </button>
                    <button id="markerPopupSave" type="button" class="btn btn-primary" onclick="saveMarkerPopup()">
                        <i class="fa fa-check"></i> Lưu marker
                    </button>
                </div>
                <button id="markerImageButton" type="button" class="btn btn-outline-primary marker-image-button" onclick="triggerMarkerImageInput()">
                    <i class="fa fa-camera"></i> Chụp / chọn ảnh
                </button>
                <div class="footer-location-actions">
                    <button id="markerCurrentLocationBtn" type="button" class="btn btn-info" onclick="setMarkerToCurrentLocation()">
                        <i class="fa fa-location-arrow"></i> Vị trí hiện tại
                    </button>
                    <button id="markerPickOnMapBtn" type="button" class="btn btn-warning" onclick="setMarkerToPickOnMap()">
                        <i class="fa fa-map-marker"></i> Chọn trên bản đồ
                    </button>
                </div>
            </div>

            <div class="body">
                <div class="form-group">
                    <label for="markerNameInput">Tên trụ</label>
                    <input id="markerNameInput" type="text" placeholder="Nhập tên trụ">
                </div>
                <div class="form-group">
                    <label for="markerBaseSelect">Marker gốc (cùng basename)</label>
                    <select id="markerBaseSelect">
                        <option value="">(Mặc định: marker trước đó)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="markerCabinetInput">Tủ điều khiển</label>
                    <input id="markerCabinetInput" type="text" placeholder="Tên tủ điều khiển">
                </div>
                <div class="form-group">
                    <label for="markerPoleTypeSelect">Loại trụ</label>
                    <select id="markerPoleTypeSelect" onchange="onPoleTypeSelectChange(this)">
                        <option value="" disabled selected>-- Chọn loại trụ --</option>
                        <option value="1">Trụ STK</option>
                        <option value="2">Trụ trang trí</option>
                        <option value="3">Trụ HTLT</option>

    <script>
        // ─── Export to CAD Modal ───
        function showExportCadModal() {
            document.getElementById('exportCadType').value = 'new';
            document.getElementById('exportCadBasename').value = '';
            updateExportCadCountInfo();
            if (typeof $ !== 'undefined' && $.fn.modal) {
                $('#exportCadModal').modal('show');
            } else {
                const modal = document.getElementById('exportCadModal');
                if (modal) {
                    modal.style.display = 'block';
                    modal.classList.add('show');
                    document.body.classList.add('modal-open');
                    const backdrop = document.createElement('div');
                    backdrop.className = 'modal-backdrop show';
                    document.body.appendChild(backdrop);
                    backdrop.onclick = () => closeExportCadModal();
                }
            }
            document.getElementById('exportCadType').onchange = updateExportCadCountInfo;
            document.getElementById('exportCadBasename').oninput = updateExportCadCountInfo;
        }

        function closeExportCadModal() {
            if (typeof $ !== 'undefined' && $.fn.modal) {
                $('#exportCadModal').modal('hide');
            } else {
                const modal = document.getElementById('exportCadModal');
                if (modal) {
                    modal.classList.remove('show');
                    modal.style.display = 'none';
                    document.body.classList.remove('modal-open');
                    const backdrop = document.querySelector('.modal-backdrop');
                    if (backdrop) document.body.removeChild(backdrop);
                }
            }
        }

        function updateExportCadCountInfo() {
            const type = document.getElementById('exportCadType').value;
            const basename = document.getElementById('exportCadBasename').value.trim();
            let rows = (type === 'new') ? (Array.isArray(newMarkerRows) ? newMarkerRows : []) : (Array.isArray(loadedData) ? loadedData : []);
            if (basename) {
                const normBase = normalizeMarkerBaseName(basename);
                rows = rows.filter(row => normalizeMarkerBaseName(row[1] || row[0] || '') === normBase);
            }
            document.getElementById('exportCadCountInfo').textContent = `Số marker sẽ xuất: ${rows.length}`;
        }

        function confirmExportCad() {
            const type = document.getElementById('exportCadType').value;
            const basename = document.getElementById('exportCadBasename').value.trim();
            let rows = [];
            if (type === 'new') {
                rows = Array.isArray(newMarkerRows) ? newMarkerRows : [];
            } else {
                rows = (Array.isArray(loadedData) && loadedData.length > 1) ? loadedData.slice(1) : [];
            }
            if (basename) {
                const normBase = normalizeMarkerBaseName(basename);
                rows = rows.filter(row => normalizeMarkerBaseName(row[1] || row[0] || '') === normBase);
            }
            if (!rows.length) { displayError('Không có marker phù hợp để xuất.'); return; }
            const dxf = createDxfForMarkers(rows);
            const baseNameForFile = basename ? sanitizeFileName(basename) : (type === 'new' ? 'marker-moi' : 'tat-ca-marker');
            const fileName = `export-${baseNameForFile}.dxf`;
            downloadTextFile(fileName, dxf);
            closeExportCadModal();
            displayError(`Đã xuất file CAD: ${fileName}`);
        }

        // ─── Auth ───
        let currentUser = null;

        function checkAuth() {
            try { currentUser = JSON.parse(localStorage.getItem('ks_user') || 'null'); } catch(e) { currentUser = null; }
            if (currentUser && currentUser.username) {
                _showApp();
            } else {
                currentUser = null;
                document.getElementById('loginOverlay').classList.add('visible');
                setTimeout(() => { const el = document.getElementById('lUsername'); if (el) el.focus(); }, 150);
            }
        }

        function _showApp() {
            document.getElementById('loginOverlay').classList.remove('visible');
            const chip = document.getElementById('topbarUser');
            if (chip) {
                chip.style.display = 'flex';
                const nameEl = document.getElementById('topbarUserName');
                if (nameEl) nameEl.textContent = currentUser.displayName || currentUser.username;
            }
            loadFromCSV();
        }

        async function doLogin() {
            const username = (document.getElementById('lUsername').value || '').trim();
            const password = document.getElementById('lPassword').value || '';
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            errEl.textContent = '';
            if (!username) { errEl.textContent = 'Vui lòng nhập tên đăng nhập'; return; }
            if (!password) { errEl.textContent = 'Vui lòng nhập mật khẩu'; return; }
            btn.disabled = true; btn.textContent = '⏳ Đang kiểm tra...';
            try {
                const res = await fetch(KHAOSAT_GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username, password })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.status === 'ok') {
                    currentUser = data.user;
                    localStorage.setItem('ks_user', JSON.stringify(currentUser));
                    _showApp();
                } else {
                    errEl.textContent = data.message || 'Sai tên đăng nhập hoặc mật khẩu';
                }
            } catch(e) {
                errEl.textContent = 'Lỗi kết nối: ' + e.message;
            } finally {
                btn.disabled = false; btn.textContent = 'Đăng nhập';
            }
        }

        function logout() {
            if (!confirm('Đăng xuất?')) return;
            currentUser = null;
            localStorage.removeItem('ks_user');
            const chip = document.getElementById('topbarUser');
            if (chip) chip.style.display = 'none';
            document.getElementById('loginOverlay').classList.add('visible');
            setTimeout(() => {
                const el = document.getElementById('lUsername');
                if (el) { el.value = ''; el.focus(); }
                const pw = document.getElementById('lPassword');
                if (pw) pw.value = '';

        // ─── Biến toàn cục ───

        let currentLocationMarker = null;
        let tempMarker = null;
        let routeLine = null;
        let pendingNewMarker = false;
        let pendingMarkerLocation = null;
        let markerPopupLocation = null;

        let lastMarkerNote = '';
        let lastMarkerCabinet = '';
        let lastMarkerPoleType = '';
        let lastMarkerLampType = '';

        let githubOwner = '';
        let githubRepo = '';
        let githubBranch = '';
        let githubToken = '';
        let _currentPopupRow = null;
        const MAX_EXCEL_TEXT_LENGTH = 32767;
        const KHAOSAT_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRjBdN5epr38kL2jLituPUC4wJO_Ohr_AsFpzaZh6Azxxs_gkzGT5s3JiZ1uFkNQFP5epR2U_wYT6wT/pub?output=csv';
        const KHAOSAT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxPFn7lnJZYdjUg5WlVq1P1JGI5O3rvcry_IVE3bhF5foDmbgT6KwBU4xFxHNwKruHRvQ/exec';

        // Nút showMoreBtn — giữ tương thích, không làm gì trong UI mới
        function toggleShowMore() {}

        function getNextMarkerName(previousName) {
            if (!previousName) return '';
            const match = previousName.match(/^(.*?)(\d+)$/);
            if (!match) return previousName;
            const prefix = match[1];
            const number = match[2];
            const nextNumber = String(parseInt(number, 10) + 1).padStart(number.length, '0');
            return prefix + nextNumber;
        }

        function normalizeMarkerBaseName(name) {
            const base = (name || '').toString().trim().replace(/[\s\-]*\d+$/, '');
            return normalizeText(base);
        }

        function parseCoord(val) {
            return parseFloat(typeof val === 'string' ? val.replace(',', '.') : val);
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const toRad = x => x * Math.PI / 180;
            const R = 6371e3;
            const phi1 = toRad(lat1), phi2 = toRad(lat2);
            const dPhi = toRad(lat2 - lat1), dLambda = toRad(lon2 - lon1);
            const a = Math.sin(dPhi/2)*Math.sin(dPhi/2) + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dLambda/2)*Math.sin(dLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function convertLatLonToVn2000(lat, lon) {
            const toRad = x => x * Math.PI / 180;
            const a = 6378137.0, f = 1/298.257222101;
            const e2 = 2*f - f*f, k0 = 0.9996;
            const zone = Math.floor((lon + 180)/6) + 1;
            const lon0 = toRad(zone*6 - 183);
            const phi = toRad(lat), lambda = toRad(lon);
            const sinPhi = Math.sin(phi), cosPhi = Math.cos(phi), tanPhi = Math.tan(phi);
            const N = a / Math.sqrt(1 - e2*sinPhi*sinPhi);
            const T = tanPhi*tanPhi, C = e2/(1-e2)*cosPhi*cosPhi;
            const A = (lambda - lon0)*cosPhi;
            const M = a * ((1-e2/4-3*Math.pow(e2,2)/64-5*Math.pow(e2,3)/256)*phi
                - (3*e2/8+3*Math.pow(e2,2)/32+45*Math.pow(e2,3)/1024)*Math.sin(2*phi)
                + (15*Math.pow(e2,2)/256+45*Math.pow(e2,3)/1024)*Math.sin(4*phi)
                - (35*Math.pow(e2,3)/3072)*Math.sin(6*phi));
            const x = k0*N*(A+(1-T+C)*Math.pow(A,3)/6+(5-18*T+T*T+72*C-58*e2/(1-e2))*Math.pow(A,5)/120);
            const y = k0*(M+N*tanPhi*(Math.pow(A,2)/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24+(61-58*T+T*T+600*C-330*e2/(1-e2))*Math.pow(A,6)/720));
            return { x: x+500000, y, zone };
        }

        function getSameNameMarkers(name) {
            if (!name) return [];
            const normalizedBase = normalizeMarkerBaseName(name);
            return markers.filter(item => normalizeMarkerBaseName(item.name || '') === normalizedBase);
        }

        function createMarkerPopupContent(row) {
            const name = row[1] || row[0] || '';
            const lat = parseCoord(row[2]), lon = parseCoord(row[3]);
            const note = row[4] || '', nguoiKS = row[5] || '';
            const type = parseInt(row[6]);
            const tudieukhien = row[7] || '', loaitru = row[8] || '', loaican = row[9] || '', loaiden = row[10] || '';
            const congSuat = row[11] || '', imageValue = row[12] || '', updatedAt = row[13] || '';
            const maPE = row[16] || '', duong = row[17] || '', phuongXa = row[18] || '';
            const cfg = TYPE_CONFIG[type] || { color: '#94a3b8', bg: '#f1f5f9', label: 'Không xác định', emoji: '💡' };

            const avatarHtml = imageValue
                ? `<img class="pc-avatar" src="${imageValue}" style="cursor:zoom-in" onerror="this.outerHTML='<div class=\\'pc-avatar-ph\\'>${cfg.emoji}</div>'" loading="lazy">`
                : `<div class="pc-avatar-ph">${cfg.emoji}</div>`;

            const coordStr = Number.isFinite(lat) && Number.isFinite(lon) ? `${lat.toFixed(6)}, ${lon.toFixed(6)}` : '—';

            const pcRows = [];
            if (tudieukhien) pcRows.push(`<div class="pc-row"><span class="pi">🗄</span><span class="pk">Tủ</span><span class="pv">${tudieukhien}</span></div>`);
            if (loaitru)     pcRows.push(`<div class="pc-row"><span class="pi">🔌</span><span class="pk">Trụ</span><span class="pv">${loaitru}</span></div>`);
            if (loaican)     pcRows.push(`<div class="pc-row"><span class="pi">📐</span><span class="pk">Cần</span><span class="pv">${loaican}</span></div>`);
            if (loaiden)     pcRows.push(`<div class="pc-row"><span class="pi">💡</span><span class="pk">Đèn</span><span class="pv">${loaiden}</span></div>`);
            if (congSuat)    pcRows.push(`<div class="pc-row"><span class="pi">⚡</span><span class="pk">Công suất</span><span class="pv">${congSuat}</span></div>`);
            if (maPE)        pcRows.push(`<div class="pc-row"><span class="pi">🔑</span><span class="pk">Mã PE</span><span class="pv">${maPE}</span></div>`);
            if (duong)       pcRows.push(`<div class="pc-row"><span class="pi">🛣</span><span class="pk">Đường</span><span class="pv">${duong}</span></div>`);
            if (phuongXa)    pcRows.push(`<div class="pc-row"><span class="pi">📍</span><span class="pk">Phường/Xã</span><span class="pv">${phuongXa}</span></div>`);
            if (nguoiKS)     pcRows.push(`<div class="pc-row"><span class="pi">👤</span><span class="pk">Người KS</span><span class="pv">${nguoiKS}</span></div>`);
            if (note)        pcRows.push(`<div class="pc-row"><span class="pi">📝</span><span class="pk">Ghi chú</span><span class="pv">${note}</span></div>`);
            if (updatedAt)   pcRows.push(`<div class="pc-row"><span class="pi">🕐</span><span class="pk">Cập nhật</span><span class="pv">${updatedAt}</span></div>`);

            const sameNameMarkers = getSameNameMarkers(name);
            const isAlreadyIncluded = sameNameMarkers.some(item => item.lat === lat && item.lon === lon && normalizeText(item.name||'') === normalizeText(name||''));
            if (!isAlreadyIncluded) sameNameMarkers.push({ lat, lon, name });
            if (sameNameMarkers.length > 1) {
                const segments = []; let totalDistance = 0;
                for (let i = 1; i < sameNameMarkers.length; i++) {
                    const prev = sameNameMarkers[i-1], cur = sameNameMarkers[i];
                    const dist = getDistanceMeters(prev.lat||parseCoord(prev[2]), prev.lon||parseCoord(prev[3]), cur.lat||parseCoord(cur[2]), cur.lon||parseCoord(cur[3]));
                    totalDistance += dist;
                    segments.push(`<option>${(prev.name||prev[1]||'?')} → ${(cur.name||cur[1]||'?')}: ${Math.round(dist)} m</option>`);
                }
                pcRows.push(`<div class="pc-row"><span class="pi">📏</span><span class="pk">Khoảng cách</span><span class="pv">${Math.round(totalDistance)} m</span><select size="3" class="pc-dist-list">${segments.join('')}</select></div>`);
            }

            return `<div class="pc">
              <div class="pc-topbar" style="background:${cfg.color}"></div>
              <div class="pc-header">
                ${avatarHtml}
                <div class="pc-meta">
                  <div class="pc-name">${name || 'Không có tên'}</div>
                  ${row[0] ? `<div class="pc-id">ID: ${row[0]}</div>` : ''}
                  <div class="pc-badge" style="background:${cfg.bg};color:${cfg.color}">${cfg.emoji} ${cfg.label}</div>
                </div>
              </div>
              <div class="pc-divider"></div>
              <div class="pc-body">${pcRows.join('')}<div class="pc-coords">📡 ${coordStr}</div></div>
              <div class="pc-actions three">
                <button class="pc-btn route" onclick="routeToMarkerLatLon(${lat},${lon})">🧭 Đi đến</button>
                <button class="pc-btn edit" onclick="openEditMarker()">✏️ Sửa</button>
                <button class="pc-btn delete" onclick="confirmDeleteMarker(this)">🗑 Xóa</button>
              </div>
            </div>`;
        }

        function updateMarkerCoordinatesInData(markerName, newLat, newLon) {
            [loadedData, newMarkerRows].forEach(arr => {
                if (Array.isArray(arr)) arr.forEach(row => {
                    if (Array.isArray(row) && (row[1]===markerName||row[0]===markerName)) { row[2]=newLat; row[3]=newLon; }
                });
            });
        }

        function makeImageIcon(url) {
            return L.divIcon({
                className: 'img-marker-icon',
                html: `<img src="${url}" alt="">`,
                iconSize: [44, 44], iconAnchor: [22, 44], popupAnchor: [0, -48]
            });
        }

        function openImageLightbox(url) {
            document.getElementById('imgLightboxImg').src = url;
            document.getElementById('imgLightbox').classList.add('open');
        }

        function closeImageLightbox() {
            document.getElementById('imgLightbox').classList.remove('open');
        }

        function addMarkerRowToMap(row) {
            const name = row[1] || row[0] || '';
            const lat = parseCoord(row[2]), lon = parseCoord(row[3]);
            if (isNaN(lat) || isNaN(lon)) return null;

            const type = parseInt(row[6]);
            const note = row[4] || '';
            const icon = customIcons[type] || customIcons.default;
            const marker = L.marker([lat, lon], { icon, draggable: true });

            marker.bindPopup(createMarkerPopupContent(row));
            marker.on('popupopen', function() {
                _currentPopupRow = row;
                marker.setPopupContent(createMarkerPopupContent(row));
                setTimeout(function() {
                    const popup = marker.getPopup();
                    if (!popup) return;
                    const el = popup.getElement();
                    if (!el) return;
                    const avatar = el.querySelector('.pc-avatar');
                    if (avatar) avatar.addEventListener('click', function() { openImageLightbox(avatar.src); });
                }, 0);
            });
            marker.on('dragend', function(e) {
                const ll = e.target.getLatLng();
                const newLat = ll.lat, newLon = ll.lng;
                const md = markers.find(m => m.marker === marker);
                if (md) { md.lat = newLat; md.lon = newLon; }
                updateMarkerCoordinatesInData(name, newLat, newLon);
                marker.setPopupContent(createMarkerPopupContent(row));
                labelLayerGroup.getLayers().forEach(layer => {
                    if (layer.getIcon().options.html && layer.getIcon().options.html.includes(name))
                        layer.setLatLng([newLat, newLon]);
                });
                displayError(`Marker "${name}" đã di chuyển đến (${newLat.toFixed(6)}, ${newLon.toFixed(6)})`);
            });

            markersCluster.addLayer(marker);
            const id = String(row[0] || '');
            markers.push({ lat, lon, name, note, id, marker });

            if (name) {
                labelLayerGroup.addLayer(L.marker([lat, lon], {
                    icon: L.divIcon({ className: 'custom-label', html: `<div style="font-size:12px;font-weight:bold">${name}</div>`, iconSize: [80,20], iconAnchor: [40,-4] }),
                    interactive: false,
                    pane: 'shadowPane'
                }));
            }
            return marker;
        }

        function updateAddMarkerButton() {
            const btn = document.getElementById('addMarkerBtn');
            if (!btn) return;
            btn.innerHTML = addMarkerMode ? '<i class="fa fa-stop"></i> Dừng thêm' : '<i class="fa fa-plus"></i> Thêm marker';
            btn.classList.toggle('btn-danger', addMarkerMode);
            btn.classList.toggle('btn-warning', !addMarkerMode);
        }

        }

            addMarkerMode = false; pendingNewMarker = false; pendingMarkerLocation = null;
            hideMarkerPopup(); updateAddMarkerButton();
            displayError('Chế độ thêm marker đã tắt.');

        const TYPE_CONFIG = {
            1: { color: '#0ea5e9', bg: '#e0f2fe', label: 'Trụ STK',            emoji: '💡', shape: 'pole' },
            2: { color: '#ec4899', bg: '#fce7f3', label: 'Trụ trang trí',      emoji: '🎆', shape: 'pole' },
            3: { color: '#10b981', bg: '#d1fae5', label: 'Trụ HTLT',           emoji: '💡', shape: 'pole' },
            4: { color: '#f97316', bg: '#ffedd5', label: 'Trụ TTLT',           emoji: '💡', shape: 'pole' },
            5: { color: '#2563eb', bg: '#dbeafe', label: 'Tủ chiếu sáng nổi', emoji: '🗄', shape: 'cabinet' },
            6: { color: '#334155', bg: '#e2e8f0', label: 'Tủ chiếu sáng ngầm',emoji: '🗄', shape: 'cabinet' },
        };

        function makeLampIcon(color) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="42" viewBox="0 0 26 42">
                <defs>
                  <filter id="ls" x="-40%" y="-20%" width="180%" height="160%">
                    <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".45"/>
                  </filter>
                </defs>
                <!-- pole -->
                <rect x="10" y="18" width="4" height="24" rx="2" fill="${color}" filter="url(#ls)"/>
                <!-- arm: curve up-right from top of pole -->
                <path d="M12 18 C12 12 15 7 22 5" stroke="${color}" stroke-width="3.2"
                      stroke-linecap="round" fill="none" filter="url(#ls)"/>
                <!-- lamp head: horizontal pill -->

        function makeElementDraggable(handle, target) {
            if (!handle || !target) return;
            let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
            handle.style.touchAction = 'none';
            handle.addEventListener('pointerdown', function(e) {
                if (e.pointerType==='mouse' && e.button!==0) return;
                dragging = true;
                const rect = target.getBoundingClientRect();
                origLeft = rect.left; origTop = rect.top;
                startX = e.clientX; startY = e.clientY;
                target.setPointerCapture(e.pointerId);
                target.classList.add('dragging'); e.preventDefault();
            });
            handle.addEventListener('pointermove', function(e) {
                if (!dragging) return;
                target.style.left = `${origLeft + e.clientX - startX}px`;
                target.style.top = `${origTop + e.clientY - startY}px`;
                target.style.transform = 'none';
            });
            const endDrag = function(e) {
                if (!dragging) return; dragging = false;
                try { target.releasePointerCapture(e.pointerId); } catch(err){}
                target.classList.remove('dragging');
            };
            handle.addEventListener('pointerup', endDrag);
            handle.addEventListener('pointercancel', endDrag);
        }
